name: Deploy Demo

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: true

on:
  push:
    branches: [demo]

jobs:
  deploy:
    name: Build and Deploy Demo
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'liyujun-dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          install_args: "go node pnpm"

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps
        run: mise run deps

      - name: Build
        run: mise run cross-compile

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.binary
          push: true
          tags: liyujun/kite:demo
          labels: runnumber=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Restart kite deployment
        env:
          KITE_HOST: ${{ secrets.KITE_DEMO_HOST }}
          KITE_AUTH: ${{ secrets.KITE_DEMO_AUTH }}
        run: |
          RESTART_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -X PATCH "$KITE_HOST/api/v1/deployments/kite/kite" \
            -H "Authorization: $KITE_AUTH" \
            -H "Content-Type: application/json" \
            -d "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kite.kubernetes.io/restartedAt\":\"$RESTART_TIME\"}}}}}"
