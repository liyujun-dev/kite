name: Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

env:
  IMAGE_NAME: liyujun/kite

jobs:
  push:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'liyujun-dev' }}
    permissions:
      packages: write
      contents: write
    outputs:
      tag_name: ${{ steps.check_version.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry (Helm chart)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          install_args: "go node pnpm"

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps
        run: mise run deps

      - name: Check version
        id: check_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build
        run: mise run cross-compile

      - name: Package binaries
        run: mise run package-binaries

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.binary
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.check_version.outputs.tag_name }}
            ${{ env.IMAGE_NAME }}:latest
          labels: runnumber=${{ github.run_id }}

      - name: Login Helm to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package Helm chart
        run: helm package charts/kite/

      - name: Push Helm chart to OCI registry
        run: |
          CHART_PACKAGE=$(ls kite-*.tgz)
          helm push "$CHART_PACKAGE" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag_name }}
          name: ${{ steps.check_version.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            bin/kite-*-${{ steps.check_version.outputs.tag_name }}.tar.gz
            kite-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-helm-index:
    runs-on: ubuntu-latest
    needs: push
    if: ${{ github.repository_owner == 'liyujun-dev' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download release assets
        run: |
          TAG_NAME=${{ needs.push.outputs.tag_name }}
          VERSION=$(echo $TAG_NAME | sed 's/^v//')

          gh release download $TAG_NAME --pattern "kite-$VERSION.tgz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm index
        run: |
          TAG_NAME=${{ needs.push.outputs.tag_name }}
          VERSION=$(echo $TAG_NAME | sed 's/^v//')

          REPO_URL="https://github.com/${{ github.repository }}/releases/download/$TAG_NAME"

          if [ -f index.yaml ]; then
            helm repo index . --url $REPO_URL --merge index.yaml
          else
            helm repo index . --url $REPO_URL
          fi

      - name: Commit and push index.yaml
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add index.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update Helm index for ${{ needs.push.outputs.tag_name }}"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
