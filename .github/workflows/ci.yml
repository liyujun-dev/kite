name: CI

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [custom]
    paths:
      - "**/*.go"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.css"
      - "go.mod"
      - "mise.toml"
      - ".github/workflows/ci.yml"
      - "ui/package.json"
      - "ui/vite.config.ts"
      - "ui/tsconfig*.json"
      - "ui/eslint.config.js"
      - "Dockerfile*"
  pull_request:
    branches: [custom]
    paths:
      - "**/*.go"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.css"
      - ".github/workflows/ci.yml"
      - "go.mod"
      - "mise.toml"
      - "ui/package.json"
      - "ui/vite.config.ts"
      - "ui/tsconfig*.json"
      - "ui/eslint.config.js"
      - "Dockerfile*"

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          install_args: "go node pnpm golangci-lint"

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps
        run: mise run deps
      - name: Build
        run: mise run build
      - name: Lint
        run: mise run pre-commit
      - name: Test
        run: mise run test
